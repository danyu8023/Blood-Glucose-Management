<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>糖安 · 智能建议</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#d9dce3;color:#1c1c1e}.phone{width:100%;max-width:430px;min-height:932px;margin:20px auto;background:#f2f2f7;border:8px solid #141416;border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,.26);overflow:hidden;position:relative}.status{height:42px;padding:10px 18px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600;position:relative}.island{position:absolute;left:50%;top:7px;transform:translateX(-50%);width:112px;height:30px;background:#111;border-radius:18px}.scroll{padding:0 18px 104px;min-height:840px}.glass{background:rgba(255,255,255,.72);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.75);box-shadow:0 8px 24px rgba(31,38,55,.08)}.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(250,250,252,.9);backdrop-filter:blur(20px);border-top:1px solid rgba(60,60,67,.12);display:flex;justify-content:space-around;align-items:center;padding:6px 8px 13px;z-index:10}.nav a{font-size:11px;text-decoration:none;color:#8e8e93;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:72px}.nav a i{font-size:20px}.nav a.active{color:#0a84ff;font-weight:600}.input{width:100%;border:0;background:#f7f7f9;border-radius:14px;padding:13px;font-size:15px;outline:none}.result{border-left:4px solid #34c759}.result.alert{border-color:#ff9f0a}.result.danger{border-color:#ff3b30}.advice-row{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #e5e5ea}.advice-row:last-child{border:0}</style></head><body><main class="phone"><div class="status"><div class="flex gap-1.5"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i></div><div class="island"></div><div class="flex gap-1.5"><span>100%</span><i class="fa-solid fa-battery-full"></i></div><span class="absolute left-1/2 -translate-x-1/2 top-[12px] text-white/90 z-10 text-[11px]">9:41</span></div><section class="scroll"><header class="flex items-center justify-between mt-4 mb-5"><a href="index.html" class="w-9 h-9 rounded-full bg-white/70 flex items-center justify-center text-[#0a84ff]"><i class="fa-solid fa-chevron-left"></i></a><div class="text-center"><p class="text-xs text-[#8e8e93]">基于最近记录</p><h1 class="text-[20px] font-semibold">智能建议</h1></div><span class="w-9"></span></header><div class="glass rounded-[26px] p-4 mb-4"><div class="grid grid-cols-2 gap-3"><label class="text-xs text-[#8e8e93]">最近血糖（mmol/L）<input id="glucoseValue" class="input mt-2 text-2xl font-semibold" type="number" value="7.2" step="0.1"></label><label class="text-xs text-[#8e8e93]">测量时段<select id="period" class="input mt-2"><option>空腹</option><option>餐前</option><option selected>餐后</option><option>睡前</option></select></label></div><div class="mt-3"><p class="text-xs text-[#8e8e93] mb-2">今日记录状态</p><div class="grid grid-cols-2 gap-2"><label class="text-sm bg-[#f7f7f9] rounded-xl p-3"><input id="mealDone" type="checkbox" checked class="accent-[#0a84ff] mr-2">饮食已记录</label><label class="text-sm bg-[#f7f7f9] rounded-xl p-3"><input id="medDone" type="checkbox" class="accent-[#5856d6] mr-2">晚餐用药待确认</label></div></div></div><div id="summary" class="result glass rounded-2xl p-4 mb-4"><div class="flex items-start gap-3"><span id="summaryIcon" class="w-9 h-9 rounded-full bg-[#e3f8ea] text-[#34c759] flex items-center justify-center"><i class="fa-solid fa-circle-check"></i></span><div><p id="summaryTitle" class="font-semibold text-sm">当前处于目标范围</p><p id="summaryText" class="text-xs text-[#6e6e73] leading-relaxed mt-2">建议保持规律饮食，餐后步行 15–20 分钟。</p></div></div></div><div class="glass rounded-2xl p-4 mb-4"><div class="flex items-center justify-between mb-2"><h2 class="font-semibold">饮食建议</h2><i class="fa-solid fa-utensils text-[#ff9f0a]"></i></div><div id="dietAdvice" class="advice-row"><i class="fa-solid fa-leaf text-[#34c759] mt-1"></i><p class="text-xs text-[#6e6e73] leading-relaxed">优先选择蔬菜、豆制品、鱼禽肉，主食控制在 1/4–1/3 盘，避免含糖饮料。</p></div><div class="advice-row"><i class="fa-solid fa-clock text-[#0a84ff] mt-1"></i><p id="mealTiming" class="text-xs text-[#6e6e73] leading-relaxed">餐后 2 小时复测血糖，记录与本餐相关的食物和份量。</p></div></div><div class="glass rounded-2xl p-4 mb-4"><div class="flex items-center justify-between mb-2"><h2 class="font-semibold">用药与行动</h2><i class="fa-solid fa-pills text-[#5856d6]"></i></div><div class="advice-row"><i class="fa-solid fa-prescription-bottle-medical text-[#5856d6] mt-1"></i><p id="medAdvice" class="text-xs text-[#6e6e73] leading-relaxed">按医生处方时间服用二甲双胍，不因单次读数自行加量或停药。</p></div><div class="advice-row"><i class="fa-solid fa-person-walking text-[#34c759] mt-1"></i><p id="actionAdvice" class="text-xs text-[#6e6e73] leading-relaxed">安排 15–20 分钟轻松步行，运动前后注意补水。</p></div></div><div class="glass rounded-2xl p-3 mb-5 flex items-start gap-2"><i class="fa-solid fa-circle-info text-[#0a84ff] mt-0.5"></i><p class="text-[11px] text-[#8e8e93] leading-relaxed">建议仅用于日常管理参考，不能替代医生诊断。连续两天异常或出现不适，请联系医生。</p></div><a href="record.html" class="w-full rounded-2xl bg-[#0a84ff] text-white py-4 flex items-center justify-center gap-2 font-semibold no-underline"><i class="fa-solid fa-pen-to-square"></i> 去补充记录</a></section><nav class="nav"><a href="index.html"><i class="fa-solid fa-house"></i><span>首页</span></a><a href="record.html"><i class="fa-solid fa-pen-to-square"></i><span>记录</span></a><a href="trends.html"><i class="fa-solid fa-chart-line"></i><span>趋势</span></a><a href="profile.html"><i class="fa-solid fa-user"></i><span>我的</span></a></nav><script>const gv=document.getElementById('glucoseValue'),period=document.getElementById('period'),medDone=document.getElementById('medDone'),summary=document.getElementById('summary'),summaryTitle=document.getElementById('summaryTitle'),summaryText=document.getElementById('summaryText'),diet=document.getElementById('dietAdvice').querySelector('p'),timing=document.getElementById('mealTiming'),med=document.getElementById('medAdvice'),action=document.getElementById('actionAdvice');function update(){const v=Number(gv.value||0),p=period.value;let title,text,dietText,medText,actionText,cls='result glass rounded-2xl p-4 mb-4';if(v<3.9){title='低血糖风险';text='先补充约 15 g 快速碳水，15 分钟后复测；若意识异常立即求助。';dietText='随身准备葡萄糖片或果汁，下一餐不要空腹等待。';medText='暂缓自行调整药物；记录发生时间并尽快联系医生评估方案。';actionText='暂缓运动，坐下休息并通知家属。';cls+=' danger'}else if(v<4.4){title='接近低血糖阈值';text='先补充少量碳水并在 15–30 分钟内复测。';dietText='本餐加入少量全谷物或水果，避免饮酒。';medText='按原处方执行，不要因一次偏低读数自行停药。';actionText='今天运动前先确认血糖稳定。';cls+=' alert'}else if(v<=7.8){title='当前处于目标范围';text='建议保持规律饮食，餐后步行 15–20 分钟。';dietText=p==='餐后'?'本餐搭配半盘非淀粉蔬菜、1/4 盘蛋白质和 1/4 盘主食。':'早餐优先蛋白质和高纤维主食，避免甜饮。';medText=medDone.checked?'晚餐用药已勾选，继续按处方时间服用。':'晚餐用药尚未确认，按处方时间完成后及时打卡。';actionText='餐后 2 小时复测并观察是否持续上升。'}else if(v<=13.9){title='血糖偏高';text='减少精制碳水和含糖饮料，补水并在 2 小时后复测。';dietText='下一餐主食减量约 1/4，增加蔬菜和优质蛋白，暂不吃甜点。';medText='不要自行增加药量；若连续偏高，把趋势记录带给医生。';actionText='安排轻度步行 15–20 分钟，出现不适立即停止。';cls+=' alert'}else{title='明显偏高，需复核';text='先复测并观察口渴、恶心、乏力等症状，必要时尽快就医。';dietText='避免含糖饮料和高碳水加餐，少量多次饮水。';medText='不要自行加药；持续高于 13.9 mmol/L 请联系医生/就医。';actionText='暂停剧烈运动，告知家属并保留本次记录。';cls+=' danger'}summary.className=cls;summaryTitle.textContent=title;summaryText.textContent=text;diet.textContent=dietText;med.textContent=medText;action.textContent=actionText;timing.textContent=p==='餐后'?'餐后 2 小时复测血糖，记录与本餐相关的食物和份量。':'按计划在下一时段测量，若连续异常请联系医生。'}gv.addEventListener('input',update);period.addEventListener('change',update);medDone.addEventListener('change',update);update();</script></main></body></html>
