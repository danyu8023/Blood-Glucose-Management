<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>控糖小课堂 · 餐盘顺序</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}body{margin:0;background:#d9dce3;color:#1c1c1e}.phone{max-width:430px;min-height:932px;margin:20px auto;background:#f2f2f7;border:8px solid #141416;border-radius:44px;box-shadow:0 24px 60px #0004;overflow:hidden}.status{height:42px;padding:10px 18px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600}.content{padding:0 20px 36px}.glass{background:#ffffffb8;backdrop-filter:blur(16px);border:1px solid #fff;box-shadow:0 8px 24px #1f26371a}</style></head><body><main class="phone"><div class="status"><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i></span><span>9:41</span><span>100% <i class="fa-solid fa-battery-full"></i></span></div><section class="content"><a href="index.html" class="inline-flex mt-4 w-9 h-9 rounded-full bg-white/70 items-center justify-center text-[#0a84ff]"><i class="fa-solid fa-chevron-left"></i></a><p class="text-xs text-[#8e8e93] mt-6">控糖小课堂</p><h1 class="text-[25px] font-bold leading-tight mt-2">一餐先吃蔬菜和蛋白质，再吃主食</h1><div class="glass rounded-2xl p-4 mt-5"><div class="flex items-center gap-3"><span class="w-12 h-12 rounded-xl bg-[#e3f8ea] text-[#34c759] flex items-center justify-center text-xl"><i class="fa-solid fa-leaf"></i></span><p class="text-sm text-[#6e6e73] leading-relaxed">“蔬菜 → 蛋白质 → 主食”的顺序，有助于增加饱腹感并减缓餐后血糖上升速度。</p></div></div><div class="glass rounded-2xl p-4 mt-4 text-sm text-[#6e6e73] leading-7"><p><b class="text-[#1c1c1e]">怎么做</b><br>先吃一半非淀粉蔬菜，再吃鱼、蛋、豆制品等蛋白质，最后吃糙米、全麦面等主食。</p><p class="mt-3"><b class="text-[#1c1c1e]">怎么估算</b><br>用餐盘分区：1/2 蔬菜，1/4 蛋白质，1/4 主食。饮料优先选择白水或无糖茶。</p><p class="mt-3">如有肾病、吞咽困难或特殊饮食医嘱，请以医生和营养师建议为准。</p></div></section></main></body></html>
