<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>健康资讯 · 餐后步行</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}body{margin:0;background:#d9dce3;color:#1c1c1e}.phone{max-width:430px;min-height:932px;margin:20px auto;background:#f2f2f7;border:8px solid #141416;border-radius:44px;box-shadow:0 24px 60px #0004;overflow:hidden}.status{height:42px;padding:10px 18px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600}.content{padding:0 20px 36px}.glass{background:#ffffffb8;backdrop-filter:blur(16px);border:1px solid #fff;box-shadow:0 8px 24px #1f26371a}.hero{height:180px;border-radius:22px;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover}</style></head><body><main class="phone"><div class="status"><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i></span><span>9:41</span><span>100% <i class="fa-solid fa-battery-full"></i></span></div><section class="content"><a href="index.html" class="inline-flex mt-4 w-9 h-9 rounded-full bg-white/70 items-center justify-center text-[#0a84ff]"><i class="fa-solid fa-chevron-left"></i></a><p class="text-xs text-[#8e8e93] mt-6">糖安健康资讯 · 2024/08/30</p><h1 class="text-[25px] font-bold leading-tight mt-2">餐后步行 15 分钟，有助于平稳餐后血糖</h1><div class="hero mt-5"><img src="https://images.unsplash.com/photo-1552674605-db6ffd4facb5?auto=format&fit=crop&w=700&q=80" alt="餐后步行"></div><article class="glass rounded-2xl p-4 mt-4 text-sm text-[#6e6e73] leading-7"><p>餐后进行轻松步行，可以帮助肌肉利用葡萄糖，减少久坐带来的餐后波动。</p><p class="mt-3">建议在餐后 20–30 分钟开始，持续 15–20 分钟，以能正常交谈的强度为宜。若运动前血糖偏低、出现头晕或冷汗，应先暂停并复测。</p><p class="mt-3">本文为公共健康科普，不替代医生针对个人情况的建议。</p></article></section></main></body></html>
