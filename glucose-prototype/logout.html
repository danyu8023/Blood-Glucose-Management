<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>糖安 · 退出登录</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#d9dce3;color:#1c1c1e}.phone{width:100%;max-width:430px;min-height:932px;margin:20px auto;background:#f2f2f7;border:8px solid #141416;border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,.26);overflow:hidden;position:relative}.status{height:42px;padding:10px 18px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600;position:relative}.island{position:absolute;left:50%;top:7px;transform:translateX(-50%);width:112px;height:30px;background:#111;border-radius:18px}.content{padding:0 24px;min-height:820px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.icon{width:74px;height:74px;border-radius:24px;background:#fff1f0;color:#ff3b30;display:grid;place-items:center;font-size:28px}.btn{width:100%;padding:15px;border-radius:16px;font-weight:600;text-decoration:none}.primary{background:#ff3b30;color:#fff}.secondary{background:#fff;color:#0a84ff;margin-top:10px}</style></head><body><main class="phone"><div class="status"><div class="flex gap-1.5"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i></div><div class="island"></div><div class="flex gap-1.5"><span>100%</span><i class="fa-solid fa-battery-full"></i></div><span class="absolute left-1/2 -translate-x-1/2 top-[12px] text-white/90 z-10 text-[11px]">9:41</span></div><section class="content"><div class="icon"><i class="fa-solid fa-arrow-right-from-bracket"></i></div><h1 class="text-2xl font-bold mt-6">退出糖安账号？</h1><p class="text-sm text-[#8e8e93] leading-relaxed mt-3">退出后不会删除本机已同步的健康记录。再次使用时需要重新登录。</p><div class="w-full mt-8"><button id="logout" class="btn primary">确认退出</button><a href="settings.html" class="btn secondary block">暂不退出</a></div></section><script>document.getElementById('logout').addEventListener('click',()=>{localStorage.removeItem('tangan_logged_in');window.location.href='login.html'});</script></main></body></html>
