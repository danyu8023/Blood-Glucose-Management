<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>糖安 · 注册</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#d9dce3;color:#1c1c1e}.phone{width:100%;max-width:430px;min-height:932px;margin:20px auto;background:#f2f2f7;border:8px solid #141416;border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,.26);overflow:hidden;position:relative}.status{height:42px;padding:10px 18px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600;position:relative}.island{position:absolute;left:50%;top:7px;transform:translateX(-50%);width:112px;height:30px;background:#111;border-radius:18px}.content{padding:0 24px 28px;min-height:820px}.input{width:100%;border:0;background:#fff;border-radius:14px;padding:14px 16px;font-size:15px;outline:none;box-shadow:inset 0 0 0 1px #e5e5ea}.input:focus{box-shadow:inset 0 0 0 2px #0a84ff}</style></head><body><main class="phone"><div class="status"><div class="flex gap-1.5"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i></div><div class="island"></div><div class="flex gap-1.5"><span>100%</span><i class="fa-solid fa-battery-full"></i></div><span class="absolute left-1/2 -translate-x-1/2 top-[12px] text-white/90 z-10 text-[11px]">9:41</span></div><section class="content"><header class="flex items-center justify-between mt-4 mb-8"><a href="login.html" class="w-9 h-9 rounded-full bg-white/70 flex items-center justify-center text-[#0a84ff]"><i class="fa-solid fa-chevron-left"></i></a><h1 class="text-[20px] font-semibold">创建账号</h1><span class="w-9"></span></header><div class="mb-7"><p class="text-2xl font-bold">开始你的健康记录</p><p class="text-sm text-[#8e8e93] mt-2">注册后可同步血糖、用药和饮食数据</p></div><form id="registerForm" class="space-y-4"><label class="block text-sm font-medium">姓名<input id="name" class="input mt-2" required type="text" placeholder="例如：张明"></label><label class="block text-sm font-medium">手机号<input id="phone" class="input mt-2" required pattern="1[3-9]\d{9}" type="tel" placeholder="11 位手机号"></label><label class="block text-sm font-medium">设置密码<input id="regPwd" class="input mt-2" required minlength="6" type="password" placeholder="至少 6 位，建议包含数字"></label><label class="block text-sm font-medium">确认密码<input id="confirmPwd" class="input mt-2" required minlength="6" type="password" placeholder="再次输入密码"></label><label class="flex items-start gap-2 text-xs text-[#6e6e73] pt-1"><input id="consent" required type="checkbox" class="accent-[#0a84ff] mt-0.5"><span>我已阅读并同意《用户协议》和《隐私政策》，同意糖安用于健康管理的数据处理。</span></label><p id="registerHint" class="text-xs text-[#ff3b30] min-h-4"></p><button class="w-full rounded-2xl bg-[#0a84ff] text-white py-4 font-semibold" type="submit">注册并开始记录</button></form><p class="text-center text-sm text-[#8e8e93] mt-6">已有账号？<a href="login.html" class="text-[#0a84ff] no-underline">立即登录</a></p></section><script>const rf=document.getElementById('registerForm'),rh=document.getElementById('registerHint');rf.addEventListener('submit',e=>{e.preventDefault();rh.textContent='';if(!rf.reportValidity())return;if(document.getElementById('regPwd').value!==document.getElementById('confirmPwd').value){rh.textContent='两次输入的密码不一致';return}localStorage.setItem('tangan_logged_in','1');localStorage.setItem('tangan_name',document.getElementById('name').value);window.location.href='index.html'});</script></main></body></html>
