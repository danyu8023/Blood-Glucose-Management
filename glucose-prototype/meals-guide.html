<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>饮食记录有什么用 · 公开指南</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}body{margin:0;background:#d9dce3;color:#1c1c1e}.phone{max-width:430px;min-height:932px;margin:20px auto;background:#f2f2f7;border:8px solid #141416;border-radius:44px;box-shadow:0 24px 60px #0004;overflow:hidden}.status{height:42px;padding:10px 18px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600}.content{padding:0 20px 36px}.glass{background:#ffffffb8;backdrop-filter:blur(16px);border:1px solid #fff;box-shadow:0 8px 24px #1f26371a}</style></head><body><main class="phone"><div class="status"><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i></span><span>9:41</span><span>100% <i class="fa-solid fa-battery-full"></i></span></div><section class="content"><a href="record.html" class="inline-flex mt-4 w-9 h-9 rounded-full bg-white/70 items-center justify-center text-[#0a84ff]"><i class="fa-solid fa-chevron-left"></i></a><p class="text-xs text-[#8e8e93] mt-6">公开记录指南</p><h1 class="text-[25px] font-bold mt-2">记录饮食有什么用</h1><div class="glass rounded-2xl p-4 mt-5 text-sm text-[#6e6e73] leading-7"><p>饮食记录可以帮助你把某次血糖变化和具体食物、份量、餐次对应起来，是医生和营养师调整方案的重要线索。</p><p class="mt-3"><b class="text-[#1c1c1e]">建议记录 4 项</b><br>餐次与时间、食物名称、主食份量、甜饮和零食。</p><p class="mt-3"><b class="text-[#1c1c1e]">记录小技巧</b><br>拍照后补充估算份量；连续记录 3–7 天，比只记某一餐更容易发现规律。</p></div><div class="glass rounded-2xl p-4 mt-4 flex items-start gap-3"><i class="fa-solid fa-lightbulb text-[#ff9f0a] mt-1"></i><p class="text-xs text-[#6e6e73] leading-relaxed">不用追求一次记录得很完美，先养成每餐都记的习惯。</p></div></section></main></body></html>
