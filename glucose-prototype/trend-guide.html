<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>趋势指标 · 公开指南</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}body{margin:0;background:#d9dce3;color:#1c1c1e}.phone{max-width:430px;min-height:932px;margin:20px auto;background:#f2f2f7;border:8px solid #141416;border-radius:44px;box-shadow:0 24px 60px #0004;overflow:hidden}.status{height:42px;padding:10px 18px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600}.content{padding:0 20px 36px}.glass{background:#ffffffb8;backdrop-filter:blur(16px);border:1px solid #fff;box-shadow:0 8px 24px #1f26371a}</style></head><body><main class="phone"><div class="status"><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i></span><span>9:41</span><span>100% <i class="fa-solid fa-battery-full"></i></span></div><section class="content"><a href="trends.html" class="inline-flex mt-4 w-9 h-9 rounded-full bg-white/70 items-center justify-center text-[#0a84ff]"><i class="fa-solid fa-chevron-left"></i></a><p class="text-xs text-[#8e8e93] mt-6">公开健康知识</p><h1 class="text-[25px] font-bold mt-2">趋势指标怎么看</h1><div class="glass rounded-2xl p-4 mt-5 text-sm text-[#6e6e73] leading-7"><p><b class="text-[#1c1c1e]">范围内时间</b><br>指血糖处于个人目标范围的时间比例，连续记录后更有参考价值。</p><p class="mt-3"><b class="text-[#1c1c1e]">平均值</b><br>用于观察整体水平，但不能代替对高低血糖事件的关注。</p><p class="mt-3"><b class="text-[#1c1c1e]">看趋势而非单点</b><br>连续 7–30 天的变化，更适合复盘饮食、运动和用药调整效果。</p></div><div class="glass rounded-2xl p-4 mt-4 flex items-start gap-3"><i class="fa-solid fa-user-doctor text-[#5856d6] mt-1"></i><p class="text-xs text-[#6e6e73] leading-relaxed">复诊时可携带趋势报告，与医生一起确认目标范围和治疗方案。</p></div></section></main></body></html>
