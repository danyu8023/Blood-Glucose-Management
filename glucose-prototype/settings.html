<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>糖安 · 设置</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#d9dce3;color:#1c1c1e}.phone{width:100%;max-width:430px;min-height:932px;margin:20px auto;background:#f2f2f7;border:8px solid #141416;border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,.26);overflow:hidden;position:relative}.status{height:42px;padding:10px 18px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600;position:relative}.island{position:absolute;left:50%;top:7px;transform:translateX(-50%);width:112px;height:30px;background:#111;border-radius:18px}.scroll{padding:0 18px 104px;min-height:840px}.glass{background:rgba(255,255,255,.72);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.75);box-shadow:0 8px 24px rgba(31,38,55,.08)}.row{display:flex;align-items:center;gap:12px;padding:16px 2px;border-bottom:1px solid #e5e5ea}.row:last-child{border:0}.switch{width:44px;height:26px;background:#d1d1d6;border-radius:20px;position:relative;cursor:pointer}.switch.on{background:#34c759}.switch:after{content:"";position:absolute;left:2px;top:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:.2s}.switch.on:after{left:20px}.nav{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(250,250,252,.9);backdrop-filter:blur(20px);border-top:1px solid rgba(60,60,67,.12);display:flex;justify-content:space-around;align-items:center;padding:6px 8px 13px;z-index:10}.nav a{font-size:11px;text-decoration:none;color:#8e8e93;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:72px}.nav a i{font-size:20px}.nav a.active{color:#0a84ff;font-weight:600}</style></head><body><main class="phone"><div class="status"><div class="flex gap-1.5"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i></div><div class="island"></div><div class="flex gap-1.5"><span>100%</span><i class="fa-solid fa-battery-full"></i></div><span class="absolute left-1/2 -translate-x-1/2 top-[12px] text-white/90 z-10 text-[11px]">9:41</span></div><section class="scroll"><header class="flex items-center justify-between mt-4 mb-6"><a href="profile.html" class="w-9 h-9 rounded-full bg-white/70 flex items-center justify-center text-[#0a84ff]"><i class="fa-solid fa-chevron-left"></i></a><h1 class="text-[20px] font-semibold">设置</h1><span class="w-9"></span></header><h2 class="font-semibold text-[18px] mb-3">提醒与通知</h2><div class="glass rounded-2xl px-4 mb-5"><div class="row"><i class="fa-solid fa-bell text-[#ff9f0a] w-6 text-center"></i><span class="flex-1 text-sm">血糖测量提醒</span><button class="switch on" data-setting="glucoseReminder" aria-label="血糖测量提醒"></button></div><div class="row"><i class="fa-solid fa-pills text-[#5856d6] w-6 text-center"></i><span class="flex-1 text-sm">用药提醒</span><button class="switch on" data-setting="medReminder" aria-label="用药提醒"></button></div><div class="row"><i class="fa-solid fa-user-group text-[#0a84ff] w-6 text-center"></i><span class="flex-1 text-sm">家属异常通知</span><button class="switch on" data-setting="familyAlert" aria-label="家属异常通知"></button></div></div><h2 class="font-semibold text-[18px] mb-3">数据与隐私</h2><div class="glass rounded-2xl px-4 mb-5"><div class="row"><i class="fa-solid fa-cloud-arrow-up text-[#0a84ff] w-6 text-center"></i><span class="flex-1 text-sm">自动同步健康数据</span><button class="switch on" data-setting="sync" aria-label="自动同步健康数据"></button></div><div class="row"><i class="fa-solid fa-lock text-[#34c759] w-6 text-center"></i><span class="flex-1 text-sm">Face ID 解锁</span><button class="switch" data-setting="faceId" aria-label="Face ID 解锁"></button></div><div class="row"><i class="fa-solid fa-file-export text-[#5856d6] w-6 text-center"></i><span class="flex-1 text-sm">导出数据</span><i class="fa-solid fa-chevron-right text-xs text-[#c7c7cc]"></i></div></div><h2 class="font-semibold text-[18px] mb-3">账户</h2><div class="glass rounded-2xl px-4 mb-4"><a href="logout.html" class="row no-underline text-[#ff3b30]"><i class="fa-solid fa-arrow-right-from-bracket w-6 text-center"></i><span class="flex-1 text-sm font-medium">退出登录</span><i class="fa-solid fa-chevron-right text-xs text-[#c7c7cc]"></i></a></div><p id="saved" class="text-center text-xs text-[#34c759] min-h-4"></p></section><nav class="nav"><a href="index.html"><i class="fa-solid fa-house"></i><span>首页</span></a><a href="record.html"><i class="fa-solid fa-pen-to-square"></i><span>记录</span></a><a href="trends.html"><i class="fa-solid fa-chart-line"></i><span>趋势</span></a><a href="profile.html" class="active"><i class="fa-solid fa-user"></i><span>我的</span></a></nav><script>const switches=[...document.querySelectorAll('.switch')];const saved=document.getElementById('saved');switches.forEach(s=>{const key='tangan_'+s.dataset.setting;if(localStorage.getItem(key)==='0')s.classList.remove('on');s.addEventListener('click',()=>{s.classList.toggle('on');localStorage.setItem(key,s.classList.contains('on')?'1':'0');saved.textContent='设置已保存';setTimeout(()=>saved.textContent='',1800)})});</script></main></body></html>
