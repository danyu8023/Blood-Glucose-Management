<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>糖安 · 健康管理介绍</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}body{margin:0;background:#d9dce3;color:#1c1c1e}.phone{max-width:430px;min-height:932px;margin:20px auto;background:#f2f2f7;border:8px solid #141416;border-radius:44px;box-shadow:0 24px 60px #0004;overflow:hidden}.status{height:42px;padding:10px 18px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600}.content{padding:0 20px 36px}.glass{background:#ffffffb8;backdrop-filter:blur(16px);border:1px solid #fff;box-shadow:0 8px 24px #1f26371a}.feature{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #e5e5ea}.feature:last-child{border:0}</style></head><body><main class="phone"><div class="status"><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i></span><span>9:41</span><span>100% <i class="fa-solid fa-battery-full"></i></span></div><section class="content"><a href="profile.html" class="inline-flex mt-4 w-9 h-9 rounded-full bg-white/70 items-center justify-center text-[#0a84ff]"><i class="fa-solid fa-chevron-left"></i></a><div class="w-14 h-14 rounded-2xl bg-[#eaf4ff] text-[#0a84ff] grid place-items-center text-2xl mt-6"><i class="fa-solid fa-book-open"></i></div><h1 class="text-[26px] font-bold mt-4">糖安健康管理</h1><p class="text-sm text-[#8e8e93] leading-relaxed mt-2">用简单、连续的记录，帮助你更了解血糖变化。</p><div class="glass rounded-2xl px-4 mt-5"><div class="feature"><i class="fa-solid fa-droplet text-[#0a84ff] mt-1"></i><p class="text-sm text-[#6e6e73] leading-relaxed"><b class="text-[#1c1c1e]">记录血糖</b><br>按空腹、餐前、餐后和睡前记录，查看变化规律。</p></div><div class="feature"><i class="fa-solid fa-utensils text-[#ff9f0a] mt-1"></i><p class="text-sm text-[#6e6e73] leading-relaxed"><b class="text-[#1c1c1e]">管理饮食</b><br>记录餐次、食物和份量，识别餐后波动来源。</p></div><div class="feature"><i class="fa-solid fa-pills text-[#5856d6] mt-1"></i><p class="text-sm text-[#6e6e73] leading-relaxed"><b class="text-[#1c1c1e]">管理用药</b><br>记录药名、剂量和时间，复诊时更容易核对。</p></div><div class="feature"><i class="fa-solid fa-wand-magic-sparkles text-[#34c759] mt-1"></i><p class="text-sm text-[#6e6e73] leading-relaxed"><b class="text-[#1c1c1e]">获得建议</b><br>根据记录生成饮食、运动、复测与就医提醒。</p></div></div><a href="register.html" class="mt-5 w-full rounded-2xl bg-[#0a84ff] text-white py-4 flex items-center justify-center font-semibold no-underline">注册后开始记录</a></section></main></body></html>
