<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>用药记录要点 · 公开指南</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}body{margin:0;background:#d9dce3;color:#1c1c1e}.phone{max-width:430px;min-height:932px;margin:20px auto;background:#f2f2f7;border:8px solid #141416;border-radius:44px;box-shadow:0 24px 60px #0004;overflow:hidden}.status{height:42px;padding:10px 18px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600}.content{padding:0 20px 36px}.glass{background:#ffffffb8;backdrop-filter:blur(16px);border:1px solid #fff;box-shadow:0 8px 24px #1f26371a}</style></head><body><main class="phone"><div class="status"><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i></span><span>9:41</span><span>100% <i class="fa-solid fa-battery-full"></i></span></div><section class="content"><a href="record.html" class="inline-flex mt-4 w-9 h-9 rounded-full bg-white/70 items-center justify-center text-[#0a84ff]"><i class="fa-solid fa-chevron-left"></i></a><p class="text-xs text-[#8e8e93] mt-6">公开记录指南</p><h1 class="text-[25px] font-bold mt-2">用药记录要点</h1><div class="glass rounded-2xl p-4 mt-5 text-sm text-[#6e6e73] leading-7"><p><b class="text-[#1c1c1e]">记录什么</b><br>药物名称、剂量、服用时间，以及是否漏服或出现不适。</p><p class="mt-3"><b class="text-[#1c1c1e]">为什么记录</b><br>便于复诊时核对依从性，也能帮助识别血糖变化与用药时间的关系。</p><p class="mt-3"><b class="text-[#ff3b30]">重要提醒</b><br>不要根据单次血糖读数自行加药、减药或停药。漏服、重复服用或出现低血糖症状时，请按医生给你的应急方案处理并联系医生。</p></div><a href="login.html" class="mt-5 w-full rounded-2xl bg-[#5856d6] text-white py-4 flex items-center justify-center font-semibold no-underline">登录后记录用药</a></section></main></body></html>
