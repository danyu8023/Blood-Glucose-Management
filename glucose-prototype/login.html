<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>糖安 · 登录</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#d9dce3;color:#1c1c1e}.phone{width:100%;max-width:430px;min-height:932px;margin:20px auto;background:#f2f2f7;border:8px solid #141416;border-radius:44px;box-shadow:0 24px 60px rgba(0,0,0,.26);overflow:hidden;position:relative}.status{height:42px;padding:10px 18px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600;position:relative}.island{position:absolute;left:50%;top:7px;transform:translateX(-50%);width:112px;height:30px;background:#111;border-radius:18px}.content{padding:0 24px 30px;min-height:820px;display:flex;flex-direction:column}.input{width:100%;border:0;background:#fff;border-radius:14px;padding:15px 16px;font-size:15px;outline:none;box-shadow:inset 0 0 0 1px #e5e5ea}.input:focus{box-shadow:inset 0 0 0 2px #0a84ff}.brand{width:58px;height:58px;border-radius:18px;background:#0a84ff;color:#fff;display:grid;place-items:center;font-size:25px;box-shadow:0 10px 22px rgba(10,132,255,.25)}</style></head><body><main class="phone"><div class="status"><div class="flex gap-1.5"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i></div><div class="island"></div><div class="flex gap-1.5"><span>100%</span><i class="fa-solid fa-battery-full"></i></div><span class="absolute left-1/2 -translate-x-1/2 top-[12px] text-white/90 z-10 text-[11px]">9:41</span></div><section class="content"><div class="flex justify-center mt-14"><div class="brand"><i class="fa-solid fa-droplet"></i></div></div><h1 class="text-center text-[28px] font-bold mt-5">欢迎回到糖安</h1><p class="text-center text-sm text-[#8e8e93] mt-2">记录每一次变化，管理每一天状态</p><form id="loginForm" class="mt-9 space-y-4"><label class="block text-sm font-medium">手机号或邮箱<input id="account" class="input mt-2" required type="text" placeholder="请输入手机号或邮箱"></label><label class="block text-sm font-medium">密码<div class="relative mt-2"><input id="password" class="input pr-12" required minlength="6" type="password" placeholder="至少 6 位密码"><button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#8e8e93]" aria-label="显示密码"><i class="fa-regular fa-eye"></i></button></div></label><div class="flex items-center justify-between text-xs"><label class="text-[#6e6e73]"><input id="remember" type="checkbox" checked class="accent-[#0a84ff] mr-1">记住登录状态</label><a href="#" class="text-[#0a84ff] no-underline">忘记密码？</a></div><button class="w-full rounded-2xl bg-[#0a84ff] text-white py-4 font-semibold mt-2" type="submit">登录</button><p id="loginHint" class="text-center text-xs text-[#ff3b30] min-h-4"></p></form><div class="mt-auto"><div class="flex items-center gap-3 text-xs text-[#aeaeb2]"><span class="h-px bg-[#d1d1d6] flex-1"></span><span>还没有糖安账号？</span><span class="h-px bg-[#d1d1d6] flex-1"></span></div><a href="register.html" class="mt-4 w-full rounded-2xl bg-white text-[#0a84ff] py-4 flex items-center justify-center font-semibold no-underline shadow-[0_2px_8px_rgba(0,0,0,.06)]">创建新账号</a><p class="text-center text-[11px] text-[#aeaeb2] mt-5">登录即表示同意《用户协议》和《隐私政策》</p></div></section><script>const form=document.getElementById('loginForm'),hint=document.getElementById('loginHint'),toggle=document.getElementById('togglePassword'),pwd=document.getElementById('password');toggle.addEventListener('click',()=>{pwd.type=pwd.type==='password'?'text':'password';toggle.innerHTML=pwd.type==='password'?'<i class="fa-regular fa-eye"></i>':'<i class="fa-regular fa-eye-slash"></i>'});form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;localStorage.setItem('tangan_logged_in','1');if(document.getElementById('remember').checked)localStorage.setItem('tangan_account',document.getElementById('account').value);window.location.href='index.html'});</script></main></body></html>
