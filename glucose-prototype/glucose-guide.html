<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>血糖怎么测 · 公开指南</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet"><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",Arial,sans-serif}body{margin:0;background:#d9dce3;color:#1c1c1e}.phone{max-width:430px;min-height:932px;margin:20px auto;background:#f2f2f7;border:8px solid #141416;border-radius:44px;box-shadow:0 24px 60px #0004;overflow:hidden}.status{height:42px;padding:10px 18px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:600}.content{padding:0 20px 36px}.glass{background:#ffffffb8;backdrop-filter:blur(16px);border:1px solid #fff;box-shadow:0 8px 24px #1f26371a}.step{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #e5e5ea}.step:last-child{border:0}.num{width:28px;height:28px;border-radius:50%;background:#eaf4ff;color:#0a84ff;display:grid;place-items:center;font-weight:700}</style></head><body><main class="phone"><div class="status"><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i></span><span>9:41</span><span>100% <i class="fa-solid fa-battery-full"></i></span></div><section class="content"><a href="record.html" class="inline-flex mt-4 w-9 h-9 rounded-full bg-white/70 items-center justify-center text-[#0a84ff]"><i class="fa-solid fa-chevron-left"></i></a><p class="text-xs text-[#8e8e93] mt-6">公开记录指南</p><h1 class="text-[25px] font-bold mt-2">血糖怎么测</h1><p class="text-sm text-[#8e8e93] mt-2">固定时段记录，趋势才有可比性</p><div class="glass rounded-2xl px-4 mt-5"><div class="step"><span class="num">1</span><p class="text-sm text-[#6e6e73] leading-relaxed"><b class="text-[#1c1c1e]">空腹</b><br>起床后、进食前测量。</p></div><div class="step"><span class="num">2</span><p class="text-sm text-[#6e6e73] leading-relaxed"><b class="text-[#1c1c1e]">餐前</b><br>进餐前立即测量并标记餐次。</p></div><div class="step"><span class="num">3</span><p class="text-sm text-[#6e6e73] leading-relaxed"><b class="text-[#1c1c1e]">餐后 2 小时</b><br>从第一口饭开始计时。</p></div><div class="step"><span class="num">4</span><p class="text-sm text-[#6e6e73] leading-relaxed"><b class="text-[#1c1c1e]">睡前</b><br>睡前测量，观察夜间风险。</p></div></div><div class="glass rounded-2xl p-4 mt-4 text-xs text-[#6e6e73] leading-relaxed"><i class="fa-solid fa-circle-info text-[#0a84ff] mr-1"></i> 目标范围因年龄、用药和疾病情况而异，具体以医生医嘱为准。</div></section></main></body></html>
